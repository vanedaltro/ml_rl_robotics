   <g id="text_1">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #82f1c5" x="43.2" y="39.6" transform="rotate(-0 43.2 39.6)">PYTORCH  /  VALIDAÇÃO</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 28px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #f4f8ff" x="43.2" y="77.04" transform="rotate(-0 43.2 77.04)">Três testes, três respostas</text>
   </g>
   <g id="text_3">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #b4c5dc" x="43.92" y="104.4" transform="rotate(-0 43.92 104.4)">Separar correção, rede e desempenho evita confundir um treino que roda com um treino que escala.</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #8bc7ff" x="59.04" y="178.56" transform="rotate(-0 59.04 178.56)">01  CORREÇÃO</text>
   </g>
   <g id="text_5">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #f4f8ff" transform="translate(59.04 209.278125)">Dois ranks no mesmo host.</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #f4f8ff" transform="translate(59.04 226.650844)">As réplicas concordam?</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #f4f8ff" transform="translate(59.04 243.314437)">A atualização bate com</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #f4f8ff" transform="translate(59.04 259.943156)">um lote global equivalente?</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #82f1c5" x="308.16" y="178.56" transform="rotate(-0 308.16 178.56)">02  CONECTIVIDADE</text>
   </g>
   <g id="text_7">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #f4f8ff" transform="translate(308.16 209.758125)">Duas máquinas na LAN.</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #f4f8ff" transform="translate(308.16 226.386844)">O ponto de encontro funciona?</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #f4f8ff" transform="translate(308.16 243.015562)">Os ranks trocam gradientes?</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #f4f8ff" transform="translate(308.16 259.644281)">O rank 0 grava o checkpoint?</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #8bc7ff" x="557.28" y="178.56" transform="rotate(-0 557.28 178.56)">03  DESEMPENHO</text>
   </g>
   <g id="text_9">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #f4f8ff" transform="translate(557.28 209.278125)">Use o mesmo lote global.</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #f4f8ff" transform="translate(557.28 225.906844)">Meça exemplos por segundo</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #f4f8ff" transform="translate(557.28 243.279562)">após aquecimento. Compare</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #f4f8ff" transform="translate(557.28 259.908281)">o tempo do rank mais lento.</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #82f1c5" x="46.08" y="356.4" transform="rotate(-0 46.08 356.4)">PONTO DE PARTIDA</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #f4f8ff" x="46.08" y="381.6" transform="rotate(-0 46.08 381.6)">1 rank × 64 exemplos  |  2 ranks × 32 exemplos</text>
   </g>
   <g id="text_12">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #b4c5dc" x="46.08" y="414.72" transform="rotate(-0 46.08 414.72)">A rede pode custar mais tempo do que a segunda máquina economiza. Meça antes de concluir.</text>
   </g>
